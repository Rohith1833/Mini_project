# The Streamlit app runs entirely in the browser via stlite (Pyodide), so the
# site is published as static files. Only the files the app needs are copied
# into dist/ to keep the local virtualenv and tests out of the deploy.
[build]
  command = "rm -rf dist && mkdir -p dist/data && cp web/index.html app.py analyzer.py dist/ && cp data/*.csv dist/data/ && cp .streamlit/config.toml dist/streamlit-config.toml"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.12"
